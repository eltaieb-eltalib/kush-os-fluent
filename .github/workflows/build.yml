name: Build Kush bootcd

# Manual trigger only. No automatic push, pull-request, or scheduled runs.
on:
  workflow_dispatch:

concurrency:
  group: kush-bootcd
  cancel-in-progress: false

jobs:
  bootcd:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # hard cap: 300 min * $0.006/min = $1.80 worst case
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (runner ships ~14GB free; ReactOS needs ~10GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /opt/hostedtoolcache || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex cmake ninja-build python3 \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
            zlib1g-dev libgmp-dev libmpfr-dev libmpc-dev ccache

      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: kush-ccache-${{ github.run_id }}
          restore-keys: kush-ccache-

      - name: Configure
        run: |
          mkdir build && cd build
          ROS_ARCH=amd64 ../configure.sh -DENABLE_CCACHE=1

      - name: Build bootcd
        run: cd build && ninja -j2 bootcd

      - name: Record build tag
        run: |
          cd build
          (cat boot/builddata.h 2>/dev/null | grep -i build || true) > ../build-tag.txt
          sha256sum bootcd.iso | tee ../build-sha256.txt

      - name: Upload ISO artifact (private, 3-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: kush-bootcd-${{ github.run_id }}
          path: |
            build/bootcd.iso
            build-sha256.txt
            build-tag.txt
          retention-days: 3
